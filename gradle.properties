# ── Gradle JVM performance ────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx2048m

# ── R8 ────────────────────────────────────────────────────────────────────────
android.enableR8.fullMode=true

# ── Compose ───────────────────────────────────────────────────────────────────
# Using Kotlin 2.0 Compose compiler plugin — no version needed in buildFeatures
# android.defaults.buildfeatures.compose=true is handled per-module

# ── Suppress warnings ─────────────────────────────────────────────────────────
android.suppressUnsupportedOptionWarnings=android.enableJetifier
