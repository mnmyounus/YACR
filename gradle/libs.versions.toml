# ╚══════════════════════════════════════════════════════════════╝

[versions]
agp                   = "8.3.2"
kotlin                = "2.0.0"
ksp                   = "2.0.0-1.0.22"
hilt                  = "2.51.1"
compose-bom           = "2024.06.00"
lifecycle             = "2.8.2"
navigation-compose    = "2.7.7"
room                  = "2.6.1"
datastore             = "1.1.1"
coroutines            = "1.8.1"
security-crypto       = "1.1.0-alpha06"
biometric             = "1.2.0-alpha05"
accompanist           = "0.34.0"
media3                = "1.3.1"
timber                = "5.0.1"
core-ktx              = "1.13.1"
activity-compose      = "1.9.0"
splashscreen          = "1.0.1"
work-runtime          = "2.9.0"
junit                 = "4.13.2"
androidx-test-ext     = "1.2.1"
espresso              = "3.6.1"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",        name = "core-ktx",               version.ref = "core-ktx"           }
androidx-activity-compose   = { group = "androidx.activity",    name = "activity-compose",       version.ref = "activity-compose"   }
androidx-splashscreen       = { group = "androidx.core",        name = "core-splashscreen",      version.ref = "splashscreen"       }

# Compose BOM
compose-bom                 = { group = "androidx.compose",     name = "compose-bom",            version.ref = "compose-bom"        }
compose-ui                  = { group = "androidx.compose.ui",  name = "ui"                                                        }
compose-ui-graphics         = { group = "androidx.compose.ui",  name = "ui-graphics"                                               }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",  name = "ui-tooling-preview"                                        }
compose-ui-tooling          = { group = "androidx.compose.ui",  name = "ui-tooling"                                                }
compose-material3           = { group = "androidx.compose.material3", name = "material3"                                            }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended"                               }
compose-runtime             = { group = "androidx.compose.runtime", name = "runtime"                                                }
compose-animation           = { group = "androidx.compose.animation", name = "animation"                                            }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-compose", version.ref = "lifecycle"    }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose",   version.ref = "lifecycle"    }
lifecycle-service           = { group = "androidx.lifecycle",   name = "lifecycle-service",           version.ref = "lifecycle"    }

# Navigation
navigation-compose          = { group = "androidx.navigation",  name = "navigation-compose",     version.ref = "navigation-compose" }

# Hilt
hilt-android                = { group = "com.google.dagger",    name = "hilt-android",           version.ref = "hilt"               }
hilt-compiler               = { group = "com.google.dagger",    name = "hilt-android-compiler",  version.ref = "hilt"               }
hilt-navigation-compose     = { group = "androidx.hilt",        name = "hilt-navigation-compose",version = "1.2.0"                  }

# Room
room-runtime                = { group = "androidx.room",        name = "room-runtime",           version.ref = "room"               }
room-ktx                    = { group = "androidx.room",        name = "room-ktx",               version.ref = "room"               }
room-compiler               = { group = "androidx.room",        name = "room-compiler",          version.ref = "room"               }

# DataStore
datastore-preferences       = { group = "androidx.datastore",   name = "datastore-preferences",  version.ref = "datastore"          }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines"   }
coroutines-core             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines"   }

# Security
security-crypto             = { group = "androidx.security",    name = "security-crypto",        version.ref = "security-crypto"    }
biometric                   = { group = "androidx.biometric",   name = "biometric",              version.ref = "biometric"          }

# Media3 (for playback)
media3-exoplayer            = { group = "androidx.media3",      name = "media3-exoplayer",       version.ref = "media3"             }
media3-ui                   = { group = "androidx.media3",      name = "media3-ui",              version.ref = "media3"             }
media3-session              = { group = "androidx.media3",      name = "media3-session",         version.ref = "media3"             }

# Accompanist
accompanist-permissions     = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist"     }

# WorkManager
work-runtime-ktx            = { group = "androidx.work",        name = "work-runtime-ktx",       version.ref = "work-runtime"       }

# Logging
timber                      = { group = "com.jakewharton.timber", name = "timber",               version.ref = "timber"             }

# Testing
junit                       = { group = "junit",                name = "junit",                  version.ref = "junit"              }
androidx-test-ext           = { group = "androidx.test.ext",    name = "junit",                  version.ref = "androidx-test-ext"  }
espresso-core               = { group = "androidx.test.espresso", name = "espresso-core",        version.ref = "espresso"           }
compose-ui-test-junit4      = { group = "androidx.compose.ui",  name = "ui-test-junit4"                                            }

[plugins]
android-application   = { id = "com.android.application",              version.ref = "agp"     }
kotlin-android        = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin"  }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin"  }
hilt-android          = { id = "com.google.dagger.hilt.android",       version.ref = "hilt"    }
ksp                   = { id = "com.google.devtools.ksp",              version.ref = "ksp"     }
kotlin-parcelize      = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
