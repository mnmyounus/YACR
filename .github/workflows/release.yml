name: 🔒 Build & Release APK

# ── Trigger ────────────────────────────────────────────────────────
# 1) Push any tag that starts with "v"  (e.g. v1.0.0, v1.2.0-beta) → auto release
# 2) Manual "Run workflow" button in the Actions tab → enter a version
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  build-release:
    name: Build · Release
    runs-on: ubuntu-latest

    # Required to create a GitHub Release and upload the APK asset
    permissions:
      contents: write

    steps:

      # ── 1. Source ────────────────────────────────────────────
      - name: ⬇ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Java ──────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle wrapper permission ─────────────────────────
      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      # ── 4. Build ─────────────────────────────────────────────
      # Uses the debug keystore (auto-generated on every runner).
      # No KEYSTORE_* secrets are required — the APK is fully
      # installable via sideload / "Install unknown apps".
      - name: 🔨 Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 5. Rename APK & capture metadata ─────────────────────
      - name: 📦 Rename APK to version tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="app/build/outputs/apk/release/YPI-${TAG}.apk"
          mv "$SRC" "$DST"
          echo "APK_PATH=$DST"       >> $GITHUB_ENV
          echo "APK_NAME=YPI-${TAG}.apk" >> $GITHUB_ENV
          echo "VERSION=$TAG"        >> $GITHUB_ENV

      # ── 6. GitHub Release ────────────────────────────────────
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YPI ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          body: |
            ## YPI – Your Privacy Indicator ${{ env.VERSION }}

            A lightweight floating dot that shows when your **camera** 🟢, **microphone** 🟠,
            or **audio** 🔵 are active — across every app on your device.

            ### Installation
            1. Download **`${{ env.APK_NAME }}`** below.
            2. On your device: **Settings → Install unknown apps** → allow your file manager.
            3. Tap the APK and install.
            4. Open YPI and complete the 2-step setup.

            ### Privacy guarantee
            - ❌ Zero `INTERNET` permission — confirmed absent in Manifest
            - 📴 100% offline — no data ever leaves your device
            - 👁 Sensor detection uses local Android system APIs only
            - 🔓 Signed with the build runner's debug key (sideload-ready)
          files: ${{ env.APK_PATH }}
          draft: false
          # Automatically mark alpha / beta / rc tags as pre-releases
          prerelease: >-
            ${{
              contains(env.VERSION, 'alpha') ||
              contains(env.VERSION, 'beta')  ||
              contains(env.VERSION, 'rc')
            }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
