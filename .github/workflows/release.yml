name: YACR — Build & Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: "Build APK"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Cache Gradle"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts','**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: "Make gradlew executable"
        run: chmod +x gradlew

      - name: "Build Release APK"
        run: ./gradlew assembleRelease --no-daemon

      - name: "Rename APK"
        run: |
          mkdir -p output
          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            cp "$apk" "output/YACR-${{ github.ref_name }}.apk"
          done

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "YACR ${{ github.ref_name }}"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
